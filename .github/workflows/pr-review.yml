name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: jules-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.ENABLE_JULES_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Jules PR Reviewer
        uses: bismillah-100/jules-pr-reviewer@main
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_suggestions: true
          rules_file: .github/jules-review-rules.md
          ignored_paths: "*.lock, .gradle/**, build/**"
          extra_instructions: |
            [DO NOT]
            - run any build such as ./gradlew

            [PROJECT CONTEXT]
            - Android app using Jetpack Compose, MVVM Architecture, and Coroutines.
            - SQLite is accessed natively via JNI (C++) using wrapper classes.
            - UI and ViewModel layers must be completely separate; logic should not reside in Compose functions.

